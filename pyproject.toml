[project]
name = "sv-knowledgebase"
version = "0.1.0"
description = "SV-Wissensbasis für den SV KI-Lotsen (reimedy × SV KI-Challenge 2026)"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "requests>=2.32",
  "beautifulsoup4>=4.12",
  "selectolax>=0.3",
  "pypdf>=4.3",
  "numpy>=1.26",
  "sqlite-vec==0.1.9",
  "fastembed>=0.4",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false
